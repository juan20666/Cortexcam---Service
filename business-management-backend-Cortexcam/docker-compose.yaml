services:

  postgres:
    image: postgres:17
    container_name: cortexcam-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cortexcam
      POSTGRES_USER: cortexcam
      POSTGRES_PASSWORD: cortexcam_dev

    ports:
      - "5432:5432"

    volumes:
      - cortexcam_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cortexcam -d cortexcam"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cortexcam-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cortexcam.com
      PGADMIN_DEFAULT_PASSWORD: cortexcam_admin

    ports:
      - "5050:80"

    volumes:
      - cortexcam_pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:

  cortexcam_postgres_data:

  cortexcam_pgadmin_data: